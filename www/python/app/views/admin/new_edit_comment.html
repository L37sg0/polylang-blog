{% extends "layouts/admin.html" %}

{% set active_menu = 'comments' %}
{% block title %}Редакция на коментар{% endblock %}

{% block admin_content %}
<div style="max-width: 600px; background: #fff; padding: 2rem; border: 1px solid #eaeaea; border-radius: 6px;">
    <h2 style="margin-bottom: 1.5rem;">Редакция на коментар</h2>
    
    <form method="POST"
            action="{{ url_for('admin.update_comment', comment_id=comment.id) }}"
    >
        
        <div class="form-group">
            <label for="content">Текст на коментара</label>
            <textarea id="content" name="content" class="form-control" rows="6" required>{{ comment.content if comment else '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Save</button>
            <a href="{{ url_for('admin.my_comments') }}" class="btn-secondary">Discard</a>
        </div>

    </form>
</div>
{% endblock %}
