{% extends "layouts/base.html" %}

{% block title %}Нова парола - Моят Блог{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Въведете нова парола</h2>
        
        <form class="auth-form" method="POST" action="{{ url_for('auth.update_password') }}">
            <!-- Скрит токен за валидация -->
            <input type="hidden" name="reset_token" value="{{ token }}">

            <div class="form-group">
                <label for="password">Нова парола</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="password_confirm">Повторете новата парола</label>
                <input type="password" id="password_confirm" name="password_confirm" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary">Обнови паролата</button>
        </form>
    </div>
</div>
{% endblock %}
