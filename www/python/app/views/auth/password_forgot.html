{% extends "layouts/base.html" %}

{% block title %}Забравена парола - Моят Блог{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Възстановяване на парола</h2>
        <p class="auth-subtitle">Въведете имейл адреса си и ще ви изпратим линк за смяна на паролата.</p>
        
        <form class="auth-form" method="POST" action="{{ url_for('auth.send_password_reset_link') }}">
            <div class="form-group">
                <label for="email">Имейл</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">
            </div>

            <button type="submit" class="btn btn-primary">Изпрати линк</button>
        </form>

        <div class="auth-links">
            <a href="{{ url_for('auth.login') }}">Обратно към входа</a>
        </div>
    </div>
</div>
{% endblock %}
