<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Моят Блог{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.localhost/css/style.css">
    <link rel="stylesheet" href="https://cdn.localhost/css/auth.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-links">
                <a href="{{ url_for('front.index') }}">Latest Posts</a>
                <a href="{{ url_for('front.authors') }}">Authors</a>
            </div>
            <div class="nav-search">
                <input type="text" placeholder="Search...">
            </div>
            <div class="nav-auth">
                {% if not session.get('user_id') %}
                <a href="{{ url_for('auth.login') }}" class="btn">Login</a>
                <a href="{{ url_for ('auth.register') }}" class="btn">Register</a>
                {% endif %}
                {% if session.get('user_id') %}
                <a href="{{ url_for('admin.my_posts') }}" class="btn">Admin</a>
                <a href="{{ url_for('auth.logout') }}" class="btn">Logout</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Polylang Blog</p>
    </footer>
</body>
</html>
